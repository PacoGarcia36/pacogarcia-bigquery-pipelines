name: Daily Sync

on:
  schedule:
    # Dos corridas por día, y la de la madrugada NO es redundante.
    #
    # La de 12:00 UTC (09:00 ART) carga el día EN CURSO, que por definición
    # queda truncado a la hora del run: VTEX sigue recibiendo órdenes las 12 h
    # siguientes, justo en el pico de ventas (13-20 ART). La ventana móvil de
    # --refresh-days lo completaba recién en la corrida del día siguiente, así
    # que la fecha más fresca de BigQuery pasaba ~24 h siendo incompleta sin que
    # nada lo dijera. Un domingo llegó así al lunes a la tarde con menos de un
    # cuarto de sus pedidos, y se leyó como un derrumbe de ventas que no existió.
    #
    # La de 03:30 UTC (00:30 ART) corre con el día anterior ya CERRADO, así que
    # lo deja completo dentro de la hora. Además le da sentido al guardrail:
    # verify_vtex.py audita hasta ayer, y ahora "ayer" es una fecha que la sync
    # acaba de terminar de cargar, no una que va a completar en 12 h.
    #
    # GitHub atrasa los cron de repos gratuitos entre 1 y 4 h. 03:30 UTC tolera
    # ese atraso sin volver a caer dentro del día que tiene que auditar.
    - cron: '30 3 * * *'   # 03:30 UTC = 00:30 ART — cierra el día anterior
    - cron: '0 12 * * *'   # 12:00 UTC = 09:00 ART — adelanta el día en curso
  workflow_dispatch:            # permite trigger manual desde GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest

    env:
      GCP_PROJECT: ${{ secrets.GCP_PROJECT }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write service account credentials
        env:
          SA_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: echo "$SA_JSON" > service_account.json

      - name: Write google-ads.yaml
        run: |
          cat > google-ads.yaml << EOF
          developer_token: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          client_id: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          client_secret: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          refresh_token: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          token_uri: https://oauth2.googleapis.com/token
          login_customer_id: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
          use_proto_plus: True
          EOF

      - name: Sync Search Console
        id: search_console
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_FILE: service_account.json
          SEARCH_CONSOLE_SITE_URL: ${{ secrets.SEARCH_CONSOLE_SITE_URL }}
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
        run: python sync_search_console.py --days 4

      # --refresh-days 21 es lo que evita que las conversiones queden congeladas:
      # Google sigue atribuyendo hacia atrás (ventana de clic de 30 días + DDA),
      # así que una fecha capturada a D+1 tiene ~2/3 de sus conversiones finales.
      # La curva medida se aplana a los ~15 días; 21 cubre la cola y tolera un
      # retraso del pipeline. El DELETE por fecha lo hace idempotente, no duplica.
      # --days 30 (y no 21) para que un corte de más de tres semanas se recupere
      # solo, igual que en VTEX. El costo NO se ve afectado por el rezago.
      - name: Sync Google Ads
        id: google_ads
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_FILE: service_account.json
          GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
        run: python sync_google_ads.py --days 30 --refresh-days 21

      # Sin flags: corrida diaria = ventana móvil de los últimos 30 días, porque
      # Meta reprocesa la atribución hasta 28 días hacia atrás. El WRITE_TRUNCATE
      # por partición (tabla$YYYYMMDD) lo hace idempotente: pisa día por día y
      # nunca duplica.
      # OJO: META_ACCESS_TOKEN es un token de USUARIO y expira cada 60 días
      # (vence 2026-09-11). Cuando caduque, este step corta con "(#190) Token de
      # Meta expirado" y hay que regenerarlo a mano y actualizar el secret.
      - name: Sync Meta Ads
        id: meta_ads
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_FILE: service_account.json
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
        run: python sync_meta_ads.py

      # --refresh-days 7 es lo que evita el bug de truncado: este run carga el día
      # en curso incompleto (todavía faltan las ventas de la tarde), así que los
      # 7 días previos se vuelven a pisar siempre. El DELETE por fecha lo hace
      # idempotente, no duplica.
      # --days 30 (y no 7) para que un corte del pipeline de más de una semana se
      # recupere solo: las fechas de los últimos 30 días que NO estén en BQ se
      # cargan igual. Las que ya están y quedaron fuera de la ventana móvil se
      # saltean, así que no cuesta nada cuando no hay agujeros.
      - name: Sync VTEX
        id: vtex
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_FILE: service_account.json
          VTEX_ACCOUNT: ${{ secrets.VTEX_ACCOUNT }}
          VTEX_APP_KEY: ${{ secrets.VTEX_APP_KEY }}
          VTEX_APP_TOKEN: ${{ secrets.VTEX_APP_TOKEN }}
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
        run: python sync_vtex.py --days 30 --refresh-days 7

      # Colchón entre la sync y la auditoría. Las dos le piden a VTEX los MISMOS
      # 30 días, y el verify arrancaba en el mismo segundo en que la sync
      # terminaba de hacer sus cientos de llamadas de detalle. VTEX rate-limitea:
      # el run #68 (2026-08-15) juntó 25 respuestas 429 y dejó una fecha sin
      # verificar, con 0 órdenes faltantes. verify_vtex.py ya throttlea y
      # reintenta por su cuenta; estos 30 s son el seguro de arriba.
      - name: Cooldown antes de auditar VTEX
        run: sleep 30

      # Guardrail: compara VTEX contra BQ día por día y rompe el run si falta
      # una sola orden. Audita días CERRADOS (excluye hoy, que es parcial por
      # definición), así que valida el trabajo de los runs anteriores.
      # Los 30 días son los mismos de los que se hace cargo la sync: todo lo que
      # el step anterior es responsable de cargar, este step lo verifica.
      - name: Verify VTEX integrity
        id: vtex_verify
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_FILE: service_account.json
          VTEX_ACCOUNT: ${{ secrets.VTEX_ACCOUNT }}
          VTEX_APP_KEY: ${{ secrets.VTEX_APP_KEY }}
          VTEX_APP_TOKEN: ${{ secrets.VTEX_APP_TOKEN }}
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
        run: python verify_vtex.py --days 30

      # Los costos por SKU no los actualizaba NADA: la tabla se habia cargado a
      # mano una vez y quedo con el 17,5% del catalogo activo y una foto del
      # 2026-09-08. Eso no se notaba porque no rompe nada: simplemente el margen
      # sale NULL y las consultas lo ignoran en silencio. El 2026-09-22 se
      # completaron los 9.530 SKUs faltantes y la cobertura quedo en 100%.
      #
      # Desde 2026-10-02 sales_with_cmv usa PRIMERO el costPrice real de cada
      # pedido (capturado en order_items_sku al momento de la venta), y recien
      # si falta cae a la foto mas reciente de esta tabla. Esta foto pasa a ser
      # el respaldo, no la fuente principal -- pero sigue siendo la UNICA fuente
      # de costo para productos que todavia no se vendieron (ej: recien dados de
      # alta), asi que conviene que no tenga huecos de dias sin actualizar.
      #
      # Por eso ahora corre COMPLETO (--todos) todos los dias en vez de solo los
      # lunes: ~80 min de llamadas a VTEX, pero asegura que un producto nuevo
      # tenga costo de respaldo desde el dia 1, sin esperar a la corrida semanal.
      # La tabla sigue siendo append-only (nunca pisa fotos anteriores), asi que
      # tambien se sigue construyendo la serie historica de precios con mas
      # densidad que antes.
      #
      # Una sola vez por dia, no las dos corridas: este workflow dispara dos
      # veces (ver comentario arriba del todo), pero duplicar ~80 min de consulta
      # completa a la API de Pricing en la corrida del mediodia no suma nada --
      # el costo de un SKU no cambia entre una corrida y la otra del mismo dia.
      # Se ata a la corrida de las 03:30 UTC (la que cierra el dia anterior).
      #
      # Va al final y despues del cooldown de VTEX a proposito: comparte el rate
      # limit con sync_vtex y verify_vtex, y no tiene sentido que compita con
      # ellos por la cuota.
      - name: Sync costos de SKU
        id: sku_costs
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_FILE: service_account.json
          VTEX_ACCOUNT: ${{ secrets.VTEX_ACCOUNT }}
          VTEX_APP_KEY: ${{ secrets.VTEX_APP_KEY }}
          VTEX_APP_TOKEN: ${{ secrets.VTEX_APP_TOKEN }}
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
        run: |
          if [ "$(date -u +%H)" -lt 10 ]; then
            python sync_sku_costs.py --todos
          else
            echo "Corrida del mediodia: la foto completa de hoy ya se hizo en la de las 03:30 UTC"
          fi

      # El snapshot de stock NO corre acá: vive en su propio workflow
      # (stock_sync.yml), que se dispara a las 21:30 UTC = 18:30 ART. El motivo es
      # de negocio, no técnico: en VTEX el stock físico se actualiza todos los días
      # a las 17:00 ART, así que un snapshot a las 09:00 guardaba la foto del día
      # anterior. Al ser un workflow aparte también puede fallar solo, sin
      # ensuciar el rojo/verde de estas 5 fuentes.

      # Gate final: continue-on-error deja cada sync en verde aunque falle,
      # así que revisamos el outcome REAL de cada una y fallamos el run si
      # alguna rompió. Esto es lo que hace que el run se vea rojo de verdad.
      - name: Fail run if any sync failed
        if: always()
        run: |
          sc="${{ steps.search_console.outcome }}"
          ads="${{ steps.google_ads.outcome }}"
          meta="${{ steps.meta_ads.outcome }}"
          vtex="${{ steps.vtex.outcome }}"
          ver="${{ steps.vtex_verify.outcome }}"
          cost="${{ steps.sku_costs.outcome }}"
          echo "Outcomes -> Search Console=$sc | Google Ads=$ads | Meta Ads=$meta | VTEX=$vtex | VTEX verify=$ver | Costos SKU=$cost"
          fail=0
          if [ "$cost" = "failure" ]; then echo "::error::Sync de costos de SKU failed -- revisar si la API de Pricing de VTEX devolvio 429 (rate limit) o si las credenciales VTEX_APP_KEY/TOKEN perdieron el scope de pricing"; fail=1; fi
          if [ "$sc" = "failure" ];   then echo "::error::Search Console sync failed"; fail=1; fi
          if [ "$ads" = "failure" ];  then echo "::error::Google Ads sync failed";     fail=1; fi
          if [ "$meta" = "failure" ]; then echo "::error::Meta Ads sync failed -- si el log dice (#190), el token de usuario vencio y hay que regenerar el secret META_ACCESS_TOKEN"; fail=1; fi
          if [ "$vtex" = "failure" ]; then echo "::error::VTEX sync failed";           fail=1; fi
          if [ "$ver" = "failure" ]; then
            echo "::error::VTEX integrity check failed. Hay CUATRO causas posibles y el mensaje viejo afirmaba siempre la primera: (a) ordenes de VTEX que no estan en BigQuery, (b) order_id duplicados, (c) ordenes con items_count>0 sin filas en order_items, o (d) fechas que no se pudieron verificar por error o rate limit de la API de VTEX -- la (d) NO es un hueco de datos, es falta de comprobacion. Abrir el log del step 'Verify VTEX integrity' y leer el bloque 'Resumen': ahi dice cual de las cuatro es."
            fail=1
          fi
          if [ "$fail" = "1" ]; then
            echo "Al menos un step fallo -- marcando el run como FAILED."
            exit 1
          fi
          echo "Las 4 syncs y el chequeo de integridad de VTEX terminaron OK."
